<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380" role="img" aria-label="Ilustrasi belajar interaktif bersama mentor">
  <defs>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f766e" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background decorative circular badge -->
  <circle cx="270" cy="190" r="150" fill="#ccfbf1" opacity="0.6"/>
  <circle cx="430" cy="90" r="45" fill="#fef3c7" opacity="0.7"/>

  <!-- Main Laptop Board -->
  <rect x="80" y="70" width="380" height="230" rx="14" fill="url(#heroCardGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)"/>
  
  <!-- Top App Header bar -->
  <rect x="80" y="70" width="380" height="36" rx="14" fill="#0d9488"/>
  <rect x="80" y="92" width="380" height="14" fill="#0d9488"/>
  <circle cx="106" cy="88" r="5" fill="#f87171"/>
  <circle cx="122" cy="88" r="5" fill="#fbbf24"/>
  <circle cx="138" cy="88" r="5" fill="#34d399"/>
  <text x="270" y="93" fill="#ffffff" font-family="'Nunito', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sesi Mentoring Interaktif</text>

  <!-- Laptop Screen Content: Video / Code / Note Blocks -->
  <rect x="105" y="125" width="200" height="110" rx="8" fill="#134e4a"/>
  <!-- Code lines dummy -->
  <rect x="120" y="145" width="80" height="6" rx="3" fill="#2dd4bf"/>
  <rect x="120" y="160" width="130" height="6" rx="3" fill="#99f6e4"/>
  <rect x="135" y="175" width="100" height="6" rx="3" fill="#f59e0b"/>
  <rect x="120" y="190" width="150" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="120" y="205" width="60" height="6" rx="3" fill="#2dd4bf"/>

  <!-- Mentor Video Window -->
  <rect x="320" y="125" width="120" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="380" cy="160" r="18" fill="#0d9488"/>
  <ellipse cx="380" cy="195" rx="26" ry="14" fill="#0d9488"/>
  <rect x="335" y="198" width="90" height="12" rx="4" fill="#0f766e"/>
  <text x="380" y="207" fill="#ffffff" font-family="'Nunito', sans-serif" font-size="8" font-weight="700" text-anchor="middle">Kak Budi (Mentor)</text>

  <!-- Live chat bubble -->
  <rect x="250" y="248" width="190" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="270" cy="267" r="10" fill="#f59e0b"/>
  <text x="270" y="271" fill="#1e293b" font-family="'Nunito', sans-serif" font-size="10" font-weight="800" text-anchor="middle">S</text>
  <text x="290" y="265" fill="#1e293b" font-family="'Nunito', sans-serif" font-size="10" font-weight="700">Tanya rumus baris 4 kak!</text>
  <text x="290" y="278" fill="#64748b" font-family="'Nunito', sans-serif" font-size="8">Siswa - Aktif</text>

  <!-- Star Badge Floating -->
  <g transform="translate(60, 160)">
    <rect width="90" height="42" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="45" y="20" fill="#0d9488" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Kelas Gratis</text>
    <text x="45" y="33" fill="#64748b" font-family="'Nunito', sans-serif" font-size="9" text-anchor="middle">SDG 4 Terjangkau</text>
  </g>

  <!-- Laptop Base Stand -->
  <path d="M40 310 L500 310 L470 326 L70 326 Z" fill="#94a3b8"/>
  <rect x="235" y="311" width="70" height="5" rx="2" fill="#cbd5e1"/>
</svg>
