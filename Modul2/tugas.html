<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Validasi Input</title>
</head>
<body>
  <form>
    <table>
      <tr>
        <td><label for="input1">Input 1:</label><br></td>
        <td><input type="text" id="input1" name="input1" value="Nilai Tetap" readonly></td>
      </tr>
      <tr>
        <td><label for="input2">Input 2:</label><br></td>
        <td><input type="text" id="input2" name="input2" maxlength="5"></td>
      </tr>
      <tr>
        <td><label for="input3">Input 3:</label><br></td>
        <td><input type="text" id="input3" name="input3" value="Tidak Aktif" disabled></td>
      </tr>
      <tr>
        <td><label for="input4">Input 4:</label><br></td>
        <td><input type="text" id="input4" name="input4" required></td>
      </tr>
      <tr>
        <td><label for="input5">Input 5:</label><br></td>
        <td><input 
        type="text" 
        id="input5" 
        name="nim" 
        maxlength="9" 
        pattern="[A-Z0-9]{9}" 
        title="Harus terdiri dari tepat 9 karakter berupa huruf KAPITAL atau ANGKA, tanpa spasi/simbol" 
        required><br><br>
      </tr>
    </table>
    <input type="submit"></td>
  </form>

</body>
</html>
